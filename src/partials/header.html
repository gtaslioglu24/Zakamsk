<a class="skip" href="#main">{{skip_link}}</a>

<header class="nav" id="top">
  <div class="wrap nav__inner">
    <a class="brand" href="{{home}}#top" aria-label="Zakamsk">
      <img src="{{root}}assets/img/logo.jpg" alt="" width="36" height="41">
      <span>Zakamsk</span>
    </a>
    <nav class="nav__links" id="site-nav" aria-label="{{nav_aria}}">
      <a href="{{home}}#opportunity">{{nav_opportunity}}</a>
      <a href="{{home}}#farm">{{nav_farm}}</a>
      <a href="{{home}}#plan">{{nav_plan}}</a>
      <a href="{{home}}#location">{{nav_location}}</a>
      <a class="nav__mobile-cta btn btn--primary" href="{{home}}#contact">{{cta_pack}}</a>
    </nav>
    <div class="nav__end">
      <div class="lang" data-lang>
        <button class="lang__btn" type="button" aria-expanded="false" aria-controls="lang-menu" aria-label="{{lang_label}}">
          <i class="ph ph-globe-simple" aria-hidden="true"></i>
          <span>{{lang_current}}</span>
          <i class="ph ph-caret-down lang__caret" aria-hidden="true"></i>
        </button>
        <ul class="lang__menu" id="lang-menu" hidden>
{{lang_menu_items}}
        </ul>
      </div>
      <a class="btn btn--primary btn--sm nav__cta" href="{{home}}#contact">{{cta_pack}}</a>
      <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-open-label="{{menu_open}}" data-close-label="{{menu_close}}" aria-label="{{menu_open}}">
        <i class="ph ph-list" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</header>
